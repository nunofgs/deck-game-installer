[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-game-installer"
version = "0.1.0"
description = "Steam Deck tool to add Windows games to Steam with Proton."
readme = "IMPLEMENTATION.md"
requires-python = ">=3.10"
dependencies = [
  "click",
  "vdf",
  "pyxdg",
  "PySide6",
]

[project.scripts]
deck-game-installer = "deck_game_installer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deck_game_installer*"]
