[tools]
go = "1.25.7"

[tasks.brew-deps]
description = "Install Fyne's C library dependencies via Homebrew"
run = "brew install mesa libx11 libxrandr libxcursor libxi libxinerama"

[tasks.app]
description = "Build and install the application"
run = """
rm -f $HOME/.local/bin/deck-game-installer
PKG_CONFIG_PATH=/home/linuxbrew/.linuxbrew/lib/pkgconfig \
CGO_CFLAGS=-I/home/linuxbrew/.linuxbrew/include \
CGO_LDFLAGS=-L/home/linuxbrew/.linuxbrew/lib \
GOBIN=$HOME/.local/bin go install ./cmd/deck-game-installer
"""

[tasks.servicemenu]
description = "Install the Dolphin service menu"
run = """
mkdir -p ~/.local/share/kio/servicemenus/
cp install-with-steam.desktop ~/.local/share/kio/servicemenus/
chmod +x ~/.local/share/kio/servicemenus/install-with-steam.desktop
"""

[tasks.install]
description = "Install the application and service menu"
depends = ["app", "servicemenu"]

[tasks.vdfprint]
description = "Build and install the vdfprint VDF pretty-printer"
run = "GOBIN=$HOME/.local/bin go install ./cmd/vdfprint"
