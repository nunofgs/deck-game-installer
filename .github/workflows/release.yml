name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne C dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o deck-game-installer ./cmd/deck-game-installer

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deck-game-installer
            install-with-steam.desktop
            install.sh
